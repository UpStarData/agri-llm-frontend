<!-- 农作物主要产区（暗色）/ 双叶幼芽 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- 白色描边层：先整组画一遍，再用主题色盖在上面，得到不依赖底图的白色轮廓。 -->
  <g fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round">
    <path d="M6.5 9.2c12 .4 17.9 6.7 17.9 17.8-12 0-17.9-6.5-17.9-17.8Z"/>
    <path d="M41.5 9.2c-12 .4-17.9 6.7-17.9 17.8 12 0 17.9-6.5 17.9-17.8Z"/>
    <rect x="21.6" y="21" width="4.8" height="21" rx="2.4"/>
  </g>
  <!-- 主题色填充层：子图形必须保持各自独立元素，同一 path 内的多条子路径会被 evenodd 挖空。 -->
  <g fill="#62D278">
    <path d="M6.5 9.2c12 .4 17.9 6.7 17.9 17.8-12 0-17.9-6.5-17.9-17.8Z"/>
    <path d="M41.5 9.2c-12 .4-17.9 6.7-17.9 17.8 12 0 17.9-6.5 17.9-17.8Z"/>
    <rect x="21.6" y="21" width="4.8" height="21" rx="2.4"/>
  </g>
</svg>
