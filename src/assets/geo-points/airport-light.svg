<!-- 机场（亮色）/ 飞机 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- 白色描边层：先整组画一遍，再用主题色盖在上面，得到不依赖底图的白色轮廓。 -->
  <g fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round">
    <path d="M24.5 3.4c1.8 0 3 1.7 3 4v9.9l16.6 9.9v4.2L27.5 26v9.4l5.8 4.5v2.7L24.5 40.8l-8.8 1.8v-2.7l5.8-4.5V26L4.4 31.4v-4.2l16.6-9.9V7.4c0-2.3 1.2-4 3.5-4Z"/>
  </g>
  <!-- 主题色填充层：子图形必须保持各自独立元素，同一 path 内的多条子路径会被 evenodd 挖空。 -->
  <g fill="#6E5BD8">
    <path d="M24.5 3.4c1.8 0 3 1.7 3 4v9.9l16.6 9.9v4.2L27.5 26v9.4l5.8 4.5v2.7L24.5 40.8l-8.8 1.8v-2.7l5.8-4.5V26L4.4 31.4v-4.2l16.6-9.9V7.4c0-2.3 1.2-4 3.5-4Z"/>
  </g>
</svg>
